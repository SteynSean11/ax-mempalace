ignoreUntil = 2027-04-30
reason = "dnspython dns.name.from_wire_parser() excessive CPU use. Fixed in 2.9.0, which requires Python >= 3.11; the newest 3.10-compatible release (2.8.0) is vulnerable. The vulnerable pin exists in uv.lock only under the python_full_version < '3.11' marker, so a default install on Python >= 3.11 never resolves it. Cleared by dropping Python 3.10 support."

