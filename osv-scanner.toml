# ax-mempalace -- OSV-Scanner configuration (read by security.yml's osv job).
#
# Every ignore is a time-boxed exception under SPEC-CICD-001 §11.7:
# owner-approved, with a reason and an expiry. When `ignoreUntil` passes the
# advisory fails the scan again and must be re-reviewed, not silently renewed.
#
# ---------------------------------------------------------------------------
# History
# ---------------------------------------------------------------------------
# The C4 baseline port added the OSV dependency scan to this fork. The fork's
# uv.lock had drifted well behind upstream and carried 103 advisories; a
# lockfile refresh cleared 77 of them. Of the remaining 26:
#
#   - 18 were reachable only through the `python_full_version < '3.11'`
#     marker (dnspython 2.8.0 and filelock 4.1.0, the newest releases that
#     still support Python 3.10; every patched release needs >= 3.11). They
#     were cleared on 2026-11-25 by raising requires-python to >= 3.12, which
#     removes that marker branch from uv.lock. Their ignores were deleted in
#     the same change, so a regression fails the scan.
#   - 8 records (4 advisories, each listed under its PYSEC and its GHSA id)
#     have no fixed release at any version. They remain below.
#
# ---------------------------------------------------------------------------
# No fixed release exists at any version (4 advisories, 8 ids)
# ---------------------------------------------------------------------------
# chromadb 1.5.9 is the newest release on PyPI, and the OSV records for
# these four advisories carry an EMPTY `fixed` list. There is no version to
# move to. The repository's own dependency floor is `chromadb>=1.5.4,<2`, so
# 1.5.9 is already the newest version the floor allows.
#
# The exposure is bounded for this repository's use:
#
#   PYSEC-2026-311    pre-authentication code injection
#   PYSEC-2026-3813   any authenticated user can read/write/delete data in
#                     any tenant's collection
#   PYSEC-2026-3814   code injection
#   PYSEC-2026-3815   SimpleRBACAuthorizationProvider does not check which
#                     tenant, database or collection a permission applies to
#
# mempalace runs ChromaDB as a LOCAL, SINGLE-TENANT store bound to
# 127.0.0.1 by default (see mempalace/config.py and the pgvector backend),
# with no HTTP server, no multi-tenant mode and no RBAC provider enabled.
# The pre-authentication and cross-tenant advisories require an exposed
# Chroma server; the code-injection advisories require an attacker-supplied
# document to reach a vulnerable parse path.
#
# These are tracked as upstream debt against chromadb, to be re-reviewed on
# chromadb's next release.
#
# ---------------------------------------------------------------------------
# Re-review
# ---------------------------------------------------------------------------
# The expiry is 2027-04-30. Before that date, re-check whether chromadb has
# published a fix. If it has, remove the corresponding entries here -- the
# scan must fail again rather than pass on a stale exception.

[[IgnoredVulns]]
id = "PYSEC-2026-311"
ignoreUntil = 2027-04-30
reason = "chromadb pre-authentication code injection. NO FIXED RELEASE EXISTS -- the OSV record has an empty fixed list and chromadb 1.5.9 is the newest release on PyPI, so there is nothing to move to. Exposure is bounded: mempalace runs ChromaDB as a local, single-tenant store bound to 127.0.0.1 with no HTTP server and no RBAC provider, so a pre-authentication path is not reachable in this deployment. Tracked as upstream chromadb debt; re-review on chromadb's next release."

[[IgnoredVulns]]
id = "PYSEC-2026-3813"
ignoreUntil = 2027-04-30
reason = "chromadb: any authenticated user can read, write, update or delete data in any tenant's collection. NO FIXED RELEASE EXISTS. Exposure is bounded: mempalace uses a local, single-tenant store with no multi-tenant mode and no HTTP server, so there are no other tenants and no authenticated remote user. Tracked as upstream chromadb debt; re-review on chromadb's next release."

[[IgnoredVulns]]
id = "PYSEC-2026-3814"
ignoreUntil = 2027-04-30
reason = "chromadb code injection. NO FIXED RELEASE EXISTS. Tracked as upstream chromadb debt; re-review on chromadb's next release."

[[IgnoredVulns]]
id = "PYSEC-2026-3815"
ignoreUntil = 2027-04-30
reason = "chromadb SimpleRBACAuthorizationProvider does not check which tenant, database or collection a permission applies to. NO FIXED RELEASE EXISTS. Exposure is bounded: mempalace does not enable SimpleRBACAuthorizationProvider -- the local Chroma backend runs without an authorization provider, and the pgvector backend is the recommended path for shared deployments. Tracked as upstream chromadb debt; re-review on chromadb's next release."

[[IgnoredVulns]]
