# ax-mempalace -- OSV-Scanner configuration (read by security.yml's osv job).
#
# Every ignore is a time-boxed exception under SPEC-CICD-001 §11.7:
# owner-approved, with a reason and an expiry. When `ignoreUntil` passes the
# advisory fails the scan again and must be re-reviewed, not silently renewed.
#
# ---------------------------------------------------------------------------
# Why this file exists
# ---------------------------------------------------------------------------
# The C4 baseline port added the OSV dependency scan to this fork. The fork's
# uv.lock had drifted well behind upstream and carried 103 advisories. The
# lockfile refresh in this PR cleared 77 of them (103 -> 26).
#
# The 26 that remain fall into exactly two groups, and NEITHER can be fixed
# by a lockfile change while this repository supports Python >= 3.10.
#
# ---------------------------------------------------------------------------
# GROUP 1 -- reachable only through the `python_full_version < '3.11'`
#             marker (23 advisories)
# ---------------------------------------------------------------------------
# The patched releases of these two packages require Python >= 3.11:
#
#   dnspython  2.9.0   (fixes GHSA-45c3-73f7-pv4m)   requires-python >=3.11
#   filelock   4.2.1   (fixes 15 advisories)          requires-python >=3.11
#
# The newest releases that still support Python 3.10 are dnspython 2.8.0 and
# filelock 4.1.0, and both are vulnerable. The resolver therefore keeps the
# vulnerable pins in the lockfile under a `python_full_version < '3.11'`
# marker while picking the clean versions for Python >= 3.11:
#
#   email-validator  -> dnspython 2.8.0  [python_full_version <  '3.11']
#                   -> dnspython 2.9.1  [python_full_version >= '3.11']
#   huggingface-hub  -> filelock   4.1.0  [python_full_version <  '3.11']
#                   -> filelock   4.2.4  [python_full_version >= '3.11']
#
# OSV-Scanner scans the lockfile, not the interpreter, so it reports the
# Python-3.10 branch even though a default installation on Python >= 3.11
# never resolves it.
#
# These 23 are cleared the moment this repository drops Python 3.10
# (requires-python >= 3.11). That is a separate decision from the C4 CI
# baseline port and is recorded as a known gap in
# .github/workflows/README-fork-notes.md. Until then they are time-boxed
# below.
#
# ---------------------------------------------------------------------------
# GROUP 2 -- no fixed release exists at any version (4 advisories)
# ---------------------------------------------------------------------------
# chromadb 1.5.9 is the newest release on PyPI, and the OSV records for
# these four advisories carry an EMPTY `fixed` list. There is no version to
# move to. The repository's own dependency floor is `chromadb>=1.5.4,<2`, so
# 1.5.9 is already the newest version the floor allows.
#
# The exposure is bounded for this repository's use:
#
#   PYSEC-2026-311    pre-authentication code injection
#   PYSEC-2026-3813   any authenticated user can read/write/delete data in
#                     any tenant's collection
#   PYSEC-2026-3814   code injection
#   PYSEC-2026-3815   SimpleRBACAuthorizationProvider does not check which
#                     tenant, database or collection a permission applies to
#
# mempalace runs ChromaDB as a LOCAL, SINGLE-TENANT store bound to
# 127.0.0.1 by default (see mempalace/config.py and the pgvector backend),
# with no HTTP server, no multi-tenant mode and no RBAC provider enabled.
# The pre-authentication and cross-tenant advisories require an exposed
# Chroma server; the code-injection advisories require an attacker-supplied
# document to reach a vulnerable parse path.
#
# These four are therefore tracked as upstream debt against chromadb, to be
# re-reviewed on chromadb's next release, and they carry the SAME expiry as
# the rest so that they cannot silently persist.
#
# ---------------------------------------------------------------------------
# Re-review
# ---------------------------------------------------------------------------
# The expiry is 2027-04-30. Before that date, re-check whether chromadb has
# published a fix, and whether this repository has dropped Python 3.10. If
# either has happened, remove the corresponding entries here -- the scan
# must fail again rather than pass on a stale exception.

[[IgnoredVulns]]
